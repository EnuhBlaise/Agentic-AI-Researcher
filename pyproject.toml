[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-research"
version = "0.1.0"
description = "Three agentic LLM workflows: reflective writing, tool-using research reports, and a multi-agent research team."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.scripts]
agentic-research = "agentic_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
